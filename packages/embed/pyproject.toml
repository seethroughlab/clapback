[project]
name = "clapback-embed"
version = "0.1.0"
description = "Deterministic CLAP audio and text embeddings, without torch or transformers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# No torch, no transformers. That is the point of the package, and it is
# measured rather than assumed: the ONNX path reproduces both the audio and the
# text output of transformers+torch to within the precision at which the vectors
# are stored. See src/clapback_embed/mel.py and artifacts.py for the numbers.
dependencies = [
    "numpy>=1.24.0",
    "librosa>=0.10.0",      # decode + STFT + the slaney mel filter bank
    "soundfile>=0.12.0",    # librosa's decoder for most formats
    "onnxruntime>=1.17.0",  # the encoders
    "tokenizers>=0.15.0",   # RoBERTa tokenizer for text queries, without transformers
    "huggingface-hub>=0.20.0",  # fetches tokenizer.json only
]

[project.optional-dependencies]
# Producing the ONNX artifacts needs the things using them does not. Nothing at
# runtime imports these.
export = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "onnx>=1.15.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clapback_embed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "artifacts: needs the exported ONNX encoders (skipped when absent)",
]
