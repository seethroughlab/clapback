# Development docker-compose.
#
# The database is published on the host (5433 below) for local work — psql, a GUI
# client, poking at a migration. That is a convenience on a throwaway database and
# **not an access path**: `ADR-0005` point 12 makes the HTTP API the only way into
# the corpus, because every guarantee it makes lives in the application rather than
# the schema. The deployed configuration exposes no database port at all
# (`docker-compose.omv.yml`, and whatever succeeds it under `ADR-0003`).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cache
      POSTGRES_PASSWORD: cache
      POSTGRES_DB: cache
    ports:
      - "5433:5432"  # Use 5433 to avoid conflicts with other PostgreSQL instances
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CACHE_DATABASE_URL: postgresql+asyncpg://cache:cache@postgres:5432/cache
      CACHE_DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
