name: clapback-server

# `ADR-0005` point 6. The embedder has had a CI gate since it was merged; the
# server has had none, and `ADR-0003` point 7 is about to make it a public
# endpoint that accepts writes. Shipping that with nothing checking it is not
# defensible now that the mechanism for having some exists.

on:
  push:
    branches: [main]
    paths:
      - "packages/server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "packages/server/**"
      - ".github/workflows/server-ci.yml"

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server
    # `ADR-0019` point 2's test is the first that needs Postgres: it contributes
    # one recording under two keys from two clients and asserts the confirmation
    # is counted, which is a fact about three tables. Everything else stays pure.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cache
          POSTGRES_PASSWORD: cache
          POSTGRES_DB: cache
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cache"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # The lock is at the workspace root, not here — `ADR-0005` point 7, as
      # amended: a uv workspace has exactly one, covering every member.
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      # The service above is for `tests/test_cross_key_agreement.py`; unset,
      # those tests skip and the rest of the suite is pure, as it always was.
      - name: Test
        env:
          CACHE_TEST_DATABASE_URL: postgresql+asyncpg://cache:cache@localhost:5432/cache
        run: uv run pytest -q
