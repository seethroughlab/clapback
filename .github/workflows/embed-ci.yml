name: clapback-embed

# The first CI gate this repository had. It was written when `fly-deploy.yml` pushed
# to production on every commit to `main` with nothing checking it first — tolerable
# for a server nobody else depended on, and not once a package is published from
# here. That workflow was removed under `ADR-0002`; the server's own gate is
# `server-ci.yml`, added under `ADR-0005` point 6.
on:
  push:
    branches: [main]
    paths:
      - "packages/embed/**"
      - ".github/workflows/embed-ci.yml"
  pull_request:
    paths:
      - "packages/embed/**"
      - ".github/workflows/embed-ci.yml"

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/embed
    steps:
      - uses: actions/checkout@v4

      # The workspace lock is committed as of `ADR-0005` point 7, so the cache
      # this action wants has a key to hang on. It previously could not be
      # enabled at all: it keys on `**/uv.lock`, nothing was tracked, and
      # setup-uv hard-errors rather than warning when the glob matches nothing.
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # A venv rather than `--system`: the runner's interpreter is externally
      # managed (PEP 668) and uv refuses to install into it.
      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      # Runs the windowing rule, the front-end arithmetic and the pooling. The
      # ONNX artifacts are 614 MB and are not fetched here, so the tests marked
      # `artifacts` skip — see the conformance job below for why that is not the
      # whole story.
      - name: Test
        run: uv run pytest -q

  conformance:
    name: Conformance against transformers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/embed
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      # The whole reason this package exists is that its output matches the
      # reference implementation. Without this job the suite would prove only that
      # the code runs, which is the failure mode the corpus cannot afford: two
      # implementations disagreeing looks exactly like two contributors
      # disagreeing, and nothing distinguishes them after the fact.
      - name: Install with the reference implementation
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install transformers

      - name: Front-end must match ClapFeatureExtractor
        run: uv run pytest tests/test_mel.py -q
