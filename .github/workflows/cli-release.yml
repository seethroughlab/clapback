name: clapback-cli release

# `ADR-0005` point 5: a release is a tag, and the tag is what publishes. Mirrors
# `embed-release.yml`, and for the same reason: publishing on merge would make a
# release a side effect rather than an act.
#
# The distribution is `clapback-cli` because the bare name on PyPI belongs to an
# unrelated 2018 package. The console script is still `clapback`.

on:
  push:
    tags: ["cli-v*"]

jobs:
  verify:
    name: Verify tag and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      # A tag that disagrees with the version it claims to release produces a
      # PyPI record nobody can trace back to a commit.
      - name: Tag must match the declared version
        run: |
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          tagged="${GITHUB_REF_NAME#cli-v}"
          if [ "$declared" != "$tagged" ]; then
            echo "tag ${GITHUB_REF_NAME} claims ${tagged}; pyproject declares ${declared}" >&2
            exit 1
          fi
          echo "releasing ${declared}"

      # The published wheel must depend on `clapback-embed` from PyPI, not on the
      # workspace checkout. `[tool.uv.sources]` is development metadata that build
      # backends ignore, so this is true by construction — but a release is the
      # moment to prove it rather than trust it.
      - name: Install from the index, as a user would
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Test
        run: .venv/bin/pytest -q

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing, so there is no long-lived PyPI token in this
      # repository to leak or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: Build
        run: uv build --out-dir ../../dist
        working-directory: packages/cli

      - uses: pypa/gh-action-pypi-publish@release/v1
