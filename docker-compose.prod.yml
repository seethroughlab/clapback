# Production docker-compose for openmediavault deployment
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cache
      POSTGRES_PASSWORD: cache
      POSTGRES_DB: cache
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CACHE_DATABASE_URL: postgresql+asyncpg://cache:cache@postgres:5432/cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
