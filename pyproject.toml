[project]
name = "familiar-cache"
version = "0.1.0"
description = "Community embedding cache for Familiar music player"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "pydantic-settings>=2.0.0",
    "slowapi>=0.1.9",
    "alembic>=1.13.0",
    "python-multipart>=0.0.6",  # For form handling in admin
    "jinja2>=3.1.0",  # HTML template rendering
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[tool.pytest.ini_options]
# The first test configuration this project has had. `pythonpath` so `app` imports
# without an editable install; `asyncio_mode` because pytest-asyncio has been a
# declared dev dependency since the start and any async test would otherwise be
# silently skipped rather than run.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
