# A virtual workspace root: it builds nothing and ships nothing.
#
# `ADR-0005` point 1 — the members are peers and none of them is the repository.
# The server lived here until then, which is why the distribution was still named
# `familiar-cache` fifteen commits after `ADR-0001` renamed the project.
#
# Each member owns its own dependencies, lock policy and CI:
#   packages/embed   clapback-embed  — the reference implementation, published to PyPI
#   packages/server  clapback-server — the commons, deployed
#   packages/cli                     — `ADR-0005` point 8 reserves the name; not yet decided
[tool.uv.workspace]
members = ["packages/embed", "packages/server"]
